[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-dating-ai"
version = "0.1.0"
description = "AI assistant for Telegram conversations"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "redis",
    "telethon==1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

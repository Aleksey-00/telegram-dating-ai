services:
  postgres:
    image: postgres:17
    container_name: dating-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dating_ai
      POSTGRES_USER: dating_ai
      POSTGRES_PASSWORD: dating_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dating_ai -d dating_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: